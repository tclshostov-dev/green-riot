name: Green Riot Edge Function Check

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/green-riot-core/**"
      - ".github/workflows/green-riot-edge-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function
        run: deno check supabase/functions/green-riot-core/index.ts
